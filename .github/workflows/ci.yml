name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        working-directory: security-checker
        run: |
          python -m pip install -r requirements.txt

      - name: Install pytest
        working-directory: security-checker
        run: |
          python -m pip install pytest

      - name: Run pytest
        working-directory: security-checker
        run: |
          python -m pytest