name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Semgrep and Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/python \
            --include "*.py" \
            --json \
            --output semgrep-results.json \
            --error

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: warn

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Enforce security gate
        if: always()
        env:
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          if [ "$SEMGREP_OUTCOME" != "success" ] || \
             [ "$GITLEAKS_OUTCOME" != "success" ]; then
            echo "Security gate failed."
            echo "Semgrep: $SEMGREP_OUTCOME"
            echo "Gitleaks: $GITLEAKS_OUTCOME"
            exit 1
          fi

          echo "Security gate passed."