name: AI DevSecOps Pipeline (Testing)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-build:
    name: Non-blocking security tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
        continue-on-error: true

      - name: Install dependencies
        continue-on-error: true
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest semgrep

      - name: Run Python tests
        id: tests
        continue-on-error: true
        run: python -m pytest -q

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/python \
            --include "*.py" \
            --json \
            --output semgrep-results.json \
            --error

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: warn

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Run SonarQube analysis
        id: sonar
        if: always()
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Analyze pipeline outcomes
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          SEMGREP: ${{ steps.semgrep.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
          SONAR: ${{ steps.sonar.outcome }}
        run: |
          echo "=================================="
          echo "AI DEVSECOPS TEST RESULTS"
          echo "=================================="
          echo "Python tests : $TESTS"
          echo "Semgrep      : $SEMGREP"
          echo "Gitleaks     : $GITLEAKS"

          if [ "$SONAR_ENABLED" = "true" ]; then
            echo "SonarQube    : $SONAR"
          else
            echo "SonarQube    : SKIPPED"
          fi

          echo ""
          echo "Testing mode: findings and scanner failures are informational."
          echo "No enforced security gate is active."

      - name: Build Docker image
        id: docker_build
        continue-on-error: true
        run: docker build -t ai-devsecops-lab:${{ github.sha }} .

      - name: Report Docker build outcome
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.docker_build.outcome }}
        run: |
          echo "Docker build: $BUILD_OUTCOME"
          echo "Testing mode: build errors are retained in the logs."