name: AI DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-pipeline:
    name: Security Testing and Reporting
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install application and testing dependencies
      - name: Install dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest semgrep requests reportlab

      # 4. Run Python tests
      - name: Run Python tests
        id: tests
        continue-on-error: true
        run: python -m pytest -q

      # 5. Run Semgrep SAST scan
      - name: Run Semgrep
        id: semgrep
        if: always()
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/python \
            --include "*.py" \
            --json \
            --output semgrep-results.json \
            .

      # 6. Upload Semgrep JSON report
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: warn
          retention-days: 30

      # 7. Scan for leaked secrets
      - name: Run Gitleaks
        id: gitleaks
        if: always()
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. Run SonarQube Cloud analysis
      - name: Run SonarQube Cloud analysis
        id: sonar
        if: always()
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 9. Generate SonarQube PDF report
      - name: Install PDF dependencies
        if: always()
        continue-on-error: true
        run: python -m pip install requests reportlab

      - name: Generate SonarQube PDF
        id: sonar_pdf
        if: always() && steps.sonar.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Akashbalaji1410_ai-devsecops-lab
        run: python scripts/sonarqube_report.py

      # 10. Upload SonarQube PDF artifact
      - name: Upload SonarQube PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-security-report
          path: reports/sonarqube-report.pdf
          if-no-files-found: warn
          retention-days: 30

      # 11. Build Docker image
      - name: Build Docker image
        id: docker_build
        if: always()
        continue-on-error: true
        run: docker build -t ai-devsecops-lab:${{ github.sha }} .

      # 12. Print pipeline outcomes
      - name: Report pipeline outcomes
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          SEMGREP: ${{ steps.semgrep.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          SONAR: ${{ steps.sonar.outcome }}
          SONAR_PDF: ${{ steps.sonar_pdf.outcome }}
          DOCKER: ${{ steps.docker_build.outcome }}
        run: |
          echo "===================================="
          echo "AI DEVSECOPS PIPELINE RESULTS"
          echo "===================================="
          echo "Python tests       : $TESTS"
          echo "Semgrep            : $SEMGREP"
          echo "Gitleaks           : $GITLEAKS"
          echo "SonarQube analysis : $SONAR"
          echo "SonarQube PDF      : $SONAR_PDF"
          echo "Docker build       : $DOCKER"
          echo "===================================="
          echo "Testing mode: scanner findings and errors are retained in logs."
          echo "Security gates are not enforced in this testing workflow."