rules:
  - id: dangerous-dynamic-execution
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    message: "Avoid unsafe dynamic execution."
    severity: ERROR
    languages:
      - python
    metadata:
      cwe:
        - "CWE-95"
      category: security
  
  - id: python-sql-injection
    pattern: cursor.execute(...)
    message: "Review SQL execution for potential SQL injection. CWE-89."
    severity: ERROR
    languages:
      - python